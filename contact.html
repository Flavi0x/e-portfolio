                    </li>

        </div>

    <main id="carte" class="container my-5">
        <section id="contact" class="reveal">
            <h1 class="text-center">Me Contacter</h1>
            <p class="text-center mb-4 lead">Une question, une proposition ? N'hésitez pas à m'envoyer un message.</p>
            
            <form id="contact-form">
                <div class="mb-3">
                    <label for="name" class="form-label">Nom</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                </div>
                <div id="form-status" class="text-center mb-3"></div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg">Envoyer le message</button>
                </div>
            </form>
        </section>
    </main>
